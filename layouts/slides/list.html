{{ define "main" }}
<div class="container mx-auto px-4 sm:px-6 max-w-5xl py-8 md:py-12">
  <header class="mb-8">
    <h1 class="text-3xl md:text-4xl font-bold text-zinc-900 dark:text-zinc-100">{{ .Title }}</h1>
    {{ with .Content }}
    <div class="prose prose-zinc max-w-none dark:prose-invert mt-4">
      {{ . }}
    </div>
    {{ end }}
  </header>

  <ul class="space-y-4">
    {{ range .Pages.ByDate.Reverse }}
    <li class="rounded-xl border border-zinc-200 bg-white px-5 py-4 shadow-sm dark:border-zinc-700 dark:bg-zinc-900">
      <a href="{{ .RelPermalink }}" class="text-lg font-semibold text-primary-600 hover:underline dark:text-primary-400">
        {{ .Title }}
      </a>
      {{ with .Params.summary }}
      <p class="mt-1 text-sm text-zinc-600 dark:text-zinc-400">{{ . }}</p>
      {{ end }}
    </li>
    {{ end }}
  </ul>
</div>
{{ end }}
